<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <!-- Grain fin, rendu à la résolution de l'écran -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
